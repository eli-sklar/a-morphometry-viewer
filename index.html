<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>A-morphometry — מציג</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#f5f4f0;font-family:-apple-system,'Segoe UI',sans-serif}
  #bar{position:fixed;top:0;right:0;left:0;display:flex;gap:6px;align-items:center;padding:8px 10px;
       padding-top:calc(8px + env(safe-area-inset-top));background:rgba(245,244,240,.94);z-index:5;flex-wrap:wrap}
  button{font-size:14px;padding:8px 14px;border:1px solid #c8c5bb;border-radius:8px;background:#fff;color:#333}
  button.on{background:#0f766e;color:#fff;border-color:#0f766e}
  #area{margin-inline-start:auto;font-size:15px;font-weight:700;color:#0f766e;white-space:nowrap}
  #cv{position:fixed;inset:0;touch-action:none}
  #hello{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:4;background:#f5f4f0}
  #hello h1{font-size:22px;color:#333;margin:0}
  #hello p{color:#777;font-size:14px;max-width:340px;text-align:center;margin:0}
  #openBtn{font-size:17px;padding:12px 26px;background:#0f766e;color:#fff;border:none}
  #err{color:#a32d2d;font-size:13px;max-width:340px;text-align:center}
</style>
</head>
<body>
<div id="hello">
  <h1>A-morphometry — מציג</h1>
  <p>פתיחת קובץ עבודה (‎.glb) שיוצא מהתוכנה במחשב. הקובץ נשאר במכשיר — שום דבר לא נשלח לרשת.</p>
  <button id="openBtn">פתח עבודה</button>
  <div id="err"></div>
  <input id="file" type="file" accept=".glb,model/gltf-binary" style="display:none">
</div>
<div id="bar" style="display:none">
  <button id="mNav" class="on">ניווט</button>
  <button id="mMark">סימון</button>
  <button id="mErase">מחיקה</button>
  <button id="mFull">מסך מלא</button>
  <span id="area">0.00 מ"ר</span>
</div>
<canvas id="cv"></canvas>
<script src="three.min.js"></script>
<script src="viewer.js"></script>
</body>
</html>
