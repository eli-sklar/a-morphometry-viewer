<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>A-morphometry</title>
<style>
  :root{--bg:#0a0a0a;--panel:#141210;--txt:#d8cdb8;--rep:#22c55e;--non:#ef4444;--acc:#3b82f6;--amber:#b8934a;--serif:"Frank Ruehl CLM","FrankRuehl","David","Narkisim","Times New Roman",serif;--sans:system-ui,"Segoe UI",Arial,sans-serif}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;position:fixed;width:100%;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  body{background:var(--bg);color:var(--txt);font-family:var(--sans)}
  button{background:#232019;color:var(--txt);border:1px solid #6b5a33;border-radius:2px;padding:8px 12px;font-size:14px;cursor:pointer;box-shadow:inset 0 0 0 2px #232019, inset 0 0 0 3px rgba(184,147,74,.40);display:inline-flex;align-items:center;justify-content:center}
  button:disabled{opacity:.4}
  button.on{background:var(--amber);color:#161310;border-color:var(--amber);font-weight:600;box-shadow:inset 0 0 0 2px var(--amber), inset 0 0 0 3px #161310}
  input[type=range]{width:120px;accent-color:var(--amber)}
  .ic{width:17px;height:17px;flex:none;vertical-align:-3px;margin-left:5px}
  .val{font-variant-numeric:tabular-nums;min-width:44px;text-align:center;font-size:12px}
  label{font-size:12px;opacity:.9}
  .grp{display:flex;gap:6px;align-items:center;background:#0003;padding:4px 8px;border-radius:2px}
  #bar{position:fixed;top:0;right:0;left:0;display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding:5px 10px;
       padding-top:calc(5px + env(safe-area-inset-top));background:rgba(17,15,12,0.96);border-bottom:1px solid #000;z-index:5;max-height:34%;overflow-y:auto}
  #area{font-family:var(--serif);font-size:19px;font-weight:700;color:var(--rep);font-variant-numeric:tabular-nums;letter-spacing:.3px;margin-inline-start:auto;white-space:nowrap}
  #side{position:fixed;top:50%;right:14px;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px;z-index:6}
  #side button{width:120px;padding:13px 8px;font-size:15px;font-weight:600;box-shadow:0 2px 8px #0007}
  #side button.nav.on{background:#1d4ed8;outline:2px solid var(--acc);color:#fff}
  #side button.add.on{background:#15803d;outline:2px solid var(--rep);color:#fff}
  #side button.rem.on{background:#b91c1c;outline:2px solid var(--non);color:#fff}
  #side button.grow.on{background:#15803d;outline:2px solid var(--rep);color:#fff}
  #cv{position:fixed;inset:0;touch-action:none}
  #side button.len.on{background:#6d28d9;outline:2px solid #a78bfa;color:#fff}
  .chip{display:inline-flex;align-items:center;gap:4px;background:#232019;border:1px solid #6b5a33;
        border-radius:2px;padding:3px 6px;cursor:pointer;margin-inline-end:4px}
  .chip.on{outline:2px solid var(--c,#22c55e);background:#2c2820}
  .chip .sw{width:13px;height:13px;border-radius:2px;background:var(--c,#22c55e);flex:none}
  .chip input{background:transparent;border:none;border-bottom:1px dotted #6b5a33;color:var(--txt);
        font-size:12px;width:70px;text-align:right;outline:none}
  .chip b{font-variant-numeric:tabular-nums;font-size:12px;color:var(--c,#22c55e);font-weight:600}
  .chip .u{font-size:10px;opacity:.6}
  #hello{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:4;background:var(--bg)}
  #hello h1{font-family:var(--serif);font-size:26px;color:var(--txt);margin:0;letter-spacing:.5px}
  #hello p{color:#8a7f68;font-size:14px;max-width:340px;text-align:center;margin:0;line-height:1.5}
  #openBtn{font-size:17px;padding:13px 30px;background:var(--amber);color:#161310;border-color:var(--amber);font-weight:600}
  #err{color:var(--non);font-size:13px;max-width:340px;text-align:center}
  #ver{color:#5c5342;font-size:12px}
</style>
</head>
<body>
<div id="hello">
  <h1>A-morphometry</h1>
  <p>פתיחת קובץ עבודה (‎.glb) שיוצא מהתוכנה במחשב.<br>הקובץ נשאר במכשיר — שום דבר לא נשלח לרשת.</p>
  <button id="openBtn">פתח עבודה</button>
  <div id="install" style="display:none;color:var(--txt);font-size:14px;max-width:360px;text-align:center;line-height:1.7;background:#141210;border:1px solid #6b5a33;border-radius:2px;padding:14px 18px">
    כדי לעבוד בשטח יש להתקין את הכלי במסך הבית:<br>
    כפתור השיתוף בספארי ← <b>הוסף למסך הבית</b> ← הוסף.<br>
    מהרגע הזה עובדים רק מהאייקון — גם בלי רשת.
  </div>
  <div id="ready" style="font-size:13px;color:#8a7f68">בודק מוכנות לשטח…</div>
  <div id="err"></div>
  <div id="ver">גרסה 14</div>
  <input id="file" type="file" style="display:none">
</div>
<div id="bar" style="display:none">
  <div class="grp">
    <label>סף ההבחנה</label>
    <input id="thr" type="range" min="0" max="1000" value="500">
    <span id="thrV" class="val">0.500</span>
  </div>
  <div class="grp">
    <label>מברשת</label>
    <input id="brush" type="range" min="2" max="40" value="10">
    <span id="brushV" class="val">0.10</span>
  </div>
  <div class="grp">
    <label>סבילות נביטה</label>
    <input id="grtol" type="range" min="2" max="60" value="14">
    <span id="grtolV" class="val">14</span>
    
  </div>
  <div class="grp" id="palArea">
    <label>סוגי שטח</label><span id="chipsA"></span>
    <button id="addType" title="סוג סימון חדש בצבע לבחירתך">＋ צבע</button>
    <input id="typeColor" type="color" value="#3b82f6" style="width:0;height:0;opacity:0;position:absolute">
  </div>
  <div class="grp" id="palLen">
    <label>עטי אורך</label><span id="chipsL"></span>
    <button id="addLen" title="עט מדידת אורך חדש">＋ עט</button>
    <input id="lenColor" type="color" value="#eab308" style="width:0;height:0;opacity:0;position:absolute">
  </div>
  <div class="grp">
    <button id="undo" disabled>↶ בטל</button>
    <button id="redo" disabled>↷ חזור</button>
  </div>
  <button id="auto"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" d="M13.4 6.4c2.6.9 3.8 3.1 3.2 5.4-.6 2.4.3 3.9-1.3 5.1-1.7 1.3-4.6.5-6.6-.2-2.2-.7-4-.3-4.9-2.2-.9-1.9.6-3.9 1.4-5.7.9-2.1 3-3.8 5.4-3.8 1.3 0 2 .6 2.8 1.4z"/><path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="m2.6 3 5.1 6.1M7.7 9.1l5.7-2.7"/><circle fill="currentColor" stroke="none" cx="2.6" cy="3" r="1.4"/><circle fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" cx="7.7" cy="9.1" r="1.2"/><circle fill="currentColor" stroke="none" cx="13.4" cy="6.4" r="1.1"/></svg> למידת הסימונים והשלמה</button>
  <button id="mExport" style="background:#0f766e;color:#fff;border-color:#0f766e">ייצוא גיליון</button>
  <button id="mImport" style="background:#0f766e;color:#fff;border-color:#0f766e">טעינת גיליון</button>
  <button id="mFull">מסך מלא</button>
  <span id="area">0.00 מ"ר</span>
</div>
<div id="side" style="display:none">
  <button id="mNav" class="nav on">ניווט</button>
  <button id="mAdd" class="add"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M8.8 2.6h6.4v12.2H8.8z"/><path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M8.8 14.8h6.4L12 21.4z"/><path fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" d="M12 2.6v12.2M10.6 17.6h2.8"/><path fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" d="M8.8 5.4h6.4"/></svg> סימון</button>
  <button id="mRem" class="rem"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M9.2 2.6h5.6a1.4 1.4 0 0 1 1.4 1.4v4.2a1.4 1.4 0 0 1-1.4 1.4H9.2A1.4 1.4 0 0 1 7.8 8.2V4a1.4 1.4 0 0 1 1.4-1.4z"/><path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M8.4 9.6h7.2l1.2 9.4a1.6 1.6 0 0 1-1.6 1.8H8.8a1.6 1.6 0 0 1-1.6-1.8z"/><path fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" d="M7.4 20.2h9.2"/></svg> מחיקה</button>

troke-width="0.76" stroke-linecap="round" d="M11.17,20.29 Q12.62,21.40 11.87,21.94 Q11.11,22.48 10.23,22.89 T9.36,23.30"/><path fill="none" stroke="currentColor" stroke-width="0.76" stroke-linecap="round" d="M4.65,15.92 Q3.59,16.05 3.34,16.64 Q3.09,17.24 2.88,17.84 T2.67,18.44"/><path fill="none" stroke="currentColor" stroke-width="0.98" stroke-linecap="round" d="M6.56,13.11 Q5.56,13.75 5.07,14.06 Q4.58,14.37 4.10,14.68 T3.61,14.99"/><path fill="none" stroke="currentColor" stroke-width="0.76" stroke-linecap="round" d="M3.20,10.64 Q2.28,11.37 1.88,12.21 Q1.48,13.06 1.16,13.73 T0.85,14.41"/><path fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" d="M10.36,11.54 Q9.05,11.17 8.33,11.32 Q7.60,11.48 6.92,11.44 T6.24,11.40"/><path fill="none" stroke="currentColor" stroke-width="0.98" stroke-linecap="round" d="M6.65,14.23 Q5.51,13.67 5.17,14.13 Q4.84,14.59 4.25,14.17 T3.66,13.75"/><path fill="none" stroke="currentColor" stroke-width="0.76" stroke-linecap="round" d="M6.20,18.25 Q6.90,20.03 6.12,20.07 Q5.33,20.11 5.43,20.80 T5.53,21.49"/><path fill="none" stroke="currentColor" stroke-width="0.76" stroke-linecap="round" d="M3.60,10.53 Q2.41,11.91 1.90,11.39 Q1.40,10.88 0.85,11.07 T0.29,11.26"/><path fill="none" stroke="currentColor" stroke-width="0.98" stroke-linecap="round" d="M6.99,9.09 Q6.95,7.82 6.81,7.40 Q6.66,6.99 6.04,7.14 T5.43,7.29"/><path fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" d="M11.01,10.62 Q10.53,9.76 10.06,9.52 Q9.58,9.27 9.42,8.77 T9.27,8.27"/><path fill="none" stroke="currentColor" stroke-width="0.98" stroke-linecap="round" d="M7.74,10.20 Q7.12,9.28 6.93,8.69 Q6.73,8.11 6.44,7.70 T6.15,7.29"/><path fill="none" stroke="currentColor" stroke-width="0.76" stroke-linecap="round" d="M4.72,10.17 Q3.73,11.31 3.44,10.64 Q3.15,9.96 2.67,10.45 T2.19,10.93"/><path fill="none" stroke="currentColor" stroke-width="0.76" stroke-linecap="round" d="M8.64,5.28 Q8.30,4.36 8.72,3.66 Q9.14,2.97 8.86,2.54 T8.59,2.12"/><  20.21,16.38 Q20.27,17.39 21.19,16.76 T22.12,16.12"/><circle fill="currentColor" stroke="none" cx="12" cy="12" r="1.5"/></svg> נביטה</button>
</div>

<script src="viewer.js"></script>
</body>
</html>
